name: Build and Push Images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'base/**'
      - 'dev/**'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'base/**'
      - 'dev/**'
  workflow_dispatch:
    inputs:
      force_base_build:
        description: 'Force rebuild of base image'
        required: false
        default: 'false'
        type: boolean

jobs:
  # ============================================================================
  # Check what changed to determine if base needs rebuilding
  # ============================================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.filter.outputs.base }}
      dev: ${{ steps.filter.outputs.dev }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - 'base/**'
            dev:
              - 'dev/**'

  # ============================================================================
  # Build Base Images (matrix: arch × ocaml version)
  # ============================================================================
  build-base:
    needs: changes
    if: |
      needs.changes.outputs.base == 'true' ||
      github.event.inputs.force_base_build == 'true' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        ocaml:
          - { version: "5.4.0", enable_tsan: "true", image_suffix: "5.4" }
          - { version: "4.14.2", enable_tsan: "false", image_suffix: "4.14" }
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reduce ASLR entropy for TSan build
        if: matrix.ocaml.enable_tsan == 'true'
        # TSan requires lower ASLR entropy to avoid memory mapping collisions
        # See: https://github.com/google/sanitizers/issues/1716
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: ./base
          file: ./base/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.ocaml.image_suffix }}-base:latest-${{ matrix.arch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.ocaml.image_suffix }}-base:latest-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            OCAML_VERSION=${{ matrix.ocaml.version }}
            ENABLE_TSAN=${{ matrix.ocaml.enable_tsan }}
          cache-from: type=gha,scope=base-${{ matrix.ocaml.image_suffix }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.ocaml.image_suffix }}-${{ matrix.arch }}

  # ============================================================================
  # Build Dev Images (matrix: arch × ocaml version)
  # ============================================================================
  build-dev:
    needs: [changes, build-base]
    if: |
      always() &&
      (needs.build-base.result == 'success' ||
       needs.build-base.result == 'skipped') &&
      (needs.changes.outputs.dev == 'true' ||
       needs.changes.outputs.base == 'true' ||
       startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        ocaml:
          - { version: "5.4.0", enable_tsan: "true", extra_profile: "runtime_events_tools", image_suffix: "5.4" }
          - { version: "4.14.2", enable_tsan: "false", extra_profile: "", image_suffix: "4.14" }
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: ./dev
          file: ./dev/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.ocaml.image_suffix }}-dev:latest-${{ matrix.arch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.ocaml.image_suffix }}-dev:latest-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.ocaml.image_suffix }}-base:latest-${{ matrix.arch }}
            OCAML_VERSION=${{ matrix.ocaml.version }}
            ENABLE_TSAN=${{ matrix.ocaml.enable_tsan }}
            OCAML_EXTRA_PROFILE=${{ matrix.ocaml.extra_profile }}
          cache-from: type=gha,scope=dev-${{ matrix.ocaml.image_suffix }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.ocaml.image_suffix }}-${{ matrix.arch }}

  # ============================================================================
  # Merge Base Image Tags into Multi-Arch Manifests
  # ============================================================================
  merge-base:
    needs: [build-base]
    if: |
      always() &&
      needs.build-base.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image_suffix: ["5.4", "4.14"]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (GHCR)
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-base:latest \
            ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-base:latest-amd64 \
            ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-base:latest-arm64

          # Add version tag if this is a release
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-base:${VERSION} \
              ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-base:latest-amd64 \
              ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-base:latest-arm64
          fi

      - name: Create and push multi-arch manifest (Docker Hub)
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-base:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-base:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-base:latest-arm64

          # Add version tag if this is a release
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-base:${VERSION} \
              ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-base:latest-amd64 \
              ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-base:latest-arm64
          fi

      - name: Verify multi-arch manifest
        run: |
          echo "=== GHCR Base Image (ocaml-${{ matrix.image_suffix }}) ==="
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-base:latest
          echo ""
          echo "=== Docker Hub Base Image (ocaml-${{ matrix.image_suffix }}) ==="
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-base:latest

  # ============================================================================
  # Merge Dev Image Tags into Multi-Arch Manifests
  # ============================================================================
  merge-dev:
    needs: [build-dev]
    if: |
      always() &&
      needs.build-dev.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image_suffix: ["5.4", "4.14"]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (GHCR)
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-dev:latest \
            ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-dev:latest-amd64 \
            ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-dev:latest-arm64

          # Add version tag if this is a release
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-dev:${VERSION} \
              ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-dev:latest-amd64 \
              ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-dev:latest-arm64
          fi

      - name: Create and push multi-arch manifest (Docker Hub)
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-dev:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-dev:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-dev:latest-arm64

          # Add version tag if this is a release
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-dev:${VERSION} \
              ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-dev:latest-amd64 \
              ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-dev:latest-arm64
          fi

      - name: Verify multi-arch manifest
        run: |
          echo "=== GHCR Dev Image (ocaml-${{ matrix.image_suffix }}) ==="
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/ocaml-${{ matrix.image_suffix }}-dev:latest
          echo ""
          echo "=== Docker Hub Dev Image (ocaml-${{ matrix.image_suffix }}) ==="
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/ocaml-${{ matrix.image_suffix }}-dev:latest
